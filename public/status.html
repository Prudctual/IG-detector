<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Status — Speed Test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050707;
      --card-bg: rgba(15, 18, 18, 0.8);
      --accent: #22c55e;
      --accent-muted: rgba(34, 197, 94, 0.1);
      --text: #ffffff;
      --text-dim: #888e8e;
      --border: #1a1f1f;
      --font-display: 'Outfit', sans-serif;
    }

    body {
      margin: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-display);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .status-container {
      width: 100%;
      max-width: 480px;
      padding: 40px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 32px;
      text-align: center;
    }

    .status-header {
      margin-bottom: 48px;
    }

    .pulse-dot {
      width: 12px; height: 12px; background: var(--accent); border-radius: 50%;
      margin: 0 auto 16px;
      box-shadow: 0 0 20px var(--accent);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
      70% { box-shadow: 0 0 0 15px rgba(34, 197, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }

    h1 { font-size: 24px; font-weight: 600; margin: 0; }
    p { color: var(--text-dim); font-size: 14px; margin: 8px 0 0; }

    .services {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 40px;
    }

    .service-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    .service-name { font-size: 15px; font-weight: 500; }
    .service-status { font-size: 12px; color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }

    .back-link {
      color: var(--text-dim);
      text-decoration: none;
      font-size: 14px;
      transition: color 0.2s;
    }
    .back-link:hover { color: #fff; }
  </style>
</head>
<body>
  <div class="status-container">
    <div class="status-header">
      <div class="pulse-dot"></div>
      <h1>All Systems Operational</h1>
      <p>Current system health and performance metrics</p>
    </div>

    <div class="services">
      <div class="service-item">
        <span class="service-name">Forensic API</span>
        <span class="service-status">Operational</span>
      </div>
      <div class="service-item">
        <span class="service-name">Database Sync</span>
        <span class="service-status">Operational</span>
      </div>
      <div class="service-item">
        <span class="service-name">Auth Gateway</span>
        <span class="service-status">Operational</span>
      </div>
      <div class="service-item">
        <span class="service-name">CDNs & Assets</span>
        <span class="service-status">Operational</span>
      </div>
    </div>

    <a href="/login.html" class="back-link">Return to Login</a>
  </div>
</body>
</html>
