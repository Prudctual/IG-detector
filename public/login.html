<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بوابة الوصول — الشبكة العالمية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050707;
      --card-bg: rgba(15, 18, 18, 0.85);
      --accent: #95f0c0;
      --text: #ffffff;
      --text-dim: #888e8e;
      --border: #1a1f1f;
      --font-main: 'Cairo', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-main);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      letter-spacing: 0; /* Remove spaces between merged letters */
    }

    .bg-mesh {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 50% 50%, rgba(149, 240, 192, 0.05) 0%, transparent 50%);
      z-index: -1;
    }

    .auth-container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
      animation: reveal 0.8s ease-out;
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .auth-card {
      background: var(--card-bg);
      backdrop-filter: blur(30px);
      border: 1px solid var(--border);
      border-radius: 32px;
      padding: 50px 40px;
      box-shadow: 0 40px 100px rgba(0,0,0,0.6);
      position: relative;
    }

    .brand-logo {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo-dot {
      width: 12px; height: 12px; background: var(--accent); border-radius: 50%;
      margin: 0 auto 16px;
      box-shadow: 0 0 20px var(--accent);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(149, 240, 192, 0.4); }
      70% { box-shadow: 0 0 0 15px rgba(149, 240, 192, 0); }
      100% { box-shadow: 0 0 0 0 rgba(149, 240, 192, 0); }
    }

    h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    .subtitle { color: var(--text-dim); font-size: 13px; text-transform: uppercase; }

    .form-stack { margin-top: 40px; }

    .field { margin-bottom: 24px; text-align: right; }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-dim);
      margin-bottom: 10px;
      padding-right: 4px;
    }

    .field input {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      color: #fff;
      font-size: 15px;
      transition: all 0.3s;
      text-align: right;
    }

    .field input:focus {
      outline: none;
      border-color: var(--accent);
      background: rgba(149, 240, 192, 0.02);
    }

    button {
      width: 100%;
      padding: 18px;
      background: var(--accent);
      color: #0b1110;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, filter 0.2s;
    }

    button:hover { filter: brightness(1.1); transform: translateY(-2px); }
    button:active { transform: translateY(0); }

    .error-box {
      background: rgba(255, 77, 77, 0.1);
      border: 1px solid rgba(255, 77, 77, 0.2);
      border-radius: 12px;
      padding: 12px;
      color: #ff4d4d;
      font-size: 13px;
      text-align: center;
      margin-bottom: 24px;
      display: none;
    }

    .footer-links {
      margin-top: 40px;
      display: flex;
      justify-content: center;
      gap: 30px;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .footer-links a {
      color: var(--text-dim);
      font-size: 12px;
      text-decoration: none;
      transition: color 0.3s;
    }
    .footer-links a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <div class="bg-mesh"></div>
  <div class="auth-container">
    <div class="auth-card">
      <div class="brand-logo">
        <div class="logo-dot"></div>
        <h1>بوابة الوصول الآمن</h1>
        <p class="subtitle">نظام إدارة الشبكة العالمية</p>
      </div>

      <div class="error-box" id="errorMsg">فشل التحقق. تم رفض الوصول.</div>

      <form id="loginForm" class="form-stack">
        <div class="field">
          <label>معرف المشغل</label>
          <input type="text" id="username" placeholder="اسم المستخدم" required autocomplete="username">
        </div>
        <div class="field">
          <label>مفتاح المرور</label>
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" id="submitBtn">بدء الجلسة</button>
      </form>

      <div class="footer-links">
        <a href="/">الرئيسية</a>
        <a href="/status.html">حالة النظام</a>
        <a href="#">المساعدة</a>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'جاري التحقق...';

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        if (response.ok) {
          submitBtn.textContent = 'تم السماح بالدخول';
          submitBtn.style.background = '#22c55e';
          const params = new URLSearchParams(window.location.search);
          const nextUrl = params.get('next') || '/dashboard';
          setTimeout(() => window.location.href = nextUrl, 800);
        } else {
          throw new Error();
        }
      } catch (err) {
        errorMsg.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'بدء الجلسة';
        document.getElementById('password').value = '';
      }
    });
  </script>
</body>
</html>
